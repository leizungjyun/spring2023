<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="Fontify 多字体预训练与视觉提示推理"><title>Fontify 多字体预训练与视觉提示推理</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#00649e"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#20272d;font-size:23px}.small{font-size:18px;fill:#526372}.label{fill:#00649e;font-weight:600}.box{fill:#eef5f9;stroke:#b8cbd7;stroke-width:1.5}.link{fill:none;stroke:#00649e;stroke-width:2.5;marker-end:url(#arrow)}.warm{fill:#854700}</style><rect class="box" x="15" y="50" width="290" height="160" rx="12"/><text x="160.0" y="90" class="label" text-anchor="middle">多字体 × 多文字</text><text x="160.0" y="122" class="small" text-anchor="middle">230 种字体</text><text x="160.0" y="154" class="small" text-anchor="middle">20 万余字形样本</text><rect class="box" x="405" y="65" width="285" height="130" rx="12"/><text x="547.5" y="105" class="label" text-anchor="middle">遮挡与重建</text><text x="547.5" y="137" class="small" text-anchor="middle">内容—风格配对 · 学习补全</text><rect class="box" x="790" y="65" width="310" height="130" rx="12"/><text x="945.0" y="105" class="label" text-anchor="middle">共享 Fontify 模型</text><text x="945.0" y="137" class="small" text-anchor="middle">学习跨字形、跨风格的表示</text><path class="link" d="M310,130 L398,130"/><path class="link" d="M695,130 L783,130"/><rect class="box" x="15" y="315" width="290" height="110" rx="12"/><text x="160" y="355" class="label" text-anchor="middle">新风格参考字 + 目标文字</text><text x="160" y="387" class="small" text-anchor="middle">视觉提示 · 单个风格示例</text><rect class="box" x="405" y="315" width="285" height="110" rx="12"/><text x="547" y="355" class="label" text-anchor="middle">Fontify 推理</text><text x="547" y="387" class="small" text-anchor="middle">参数保持不变 · 补全新字形</text><rect class="box" x="790" y="315" width="310" height="110" rx="12"/><text x="945" y="355" class="label" text-anchor="middle">目标文字的新字形</text><text x="945" y="387" class="small" text-anchor="middle">以参考风格生成</text><path class="link" d="M310,370 L398,370"/><path class="link" d="M695,370 L783,370"/><path class="link" d="M945,200 L945,245 L547,245 L547,308"/><text x="380" y="280" class="small" text-anchor="middle">预训练后复用共享参数</text></svg>