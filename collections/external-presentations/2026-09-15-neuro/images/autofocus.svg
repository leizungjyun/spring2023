<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" role="img" aria-labelledby="autofocus-title autofocus-desc">
<title id="autofocus-title">三模块自动对焦闭环</title>
<desc id="autofocus-desc">图像传感器向焦点估计与控制提供输入，再驱动调焦执行机构。执行器与调焦镜组改变镜头位置及成像状态，并反馈至图像传感器。整机对焦时间由实际闭环共同决定。</desc>
<defs><marker id="af-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42affa"/></marker><marker id="af-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aab7c3"/></marker></defs>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<!-- Boxes are system components; the highlighted component is our proposed scope. -->
<rect x="100" y="20" width="260" height="72" rx="10" fill="#20272d" stroke="#aab7c3" stroke-width="2"/>
<rect x="420" y="20" width="260" height="72" rx="10" fill="#3c3328" stroke="#ffbf69" stroke-width="2"/>
<rect x="740" y="20" width="260" height="72" rx="10" fill="#20272d" stroke="#aab7c3" stroke-width="2"/>
<g font-size="25" fill="#f5f7fa" text-anchor="middle"><text x="230" y="65">图像传感器</text><text x="550" y="65">焦点估计与控制</text><text x="870" y="65">调焦执行机构</text></g>
<g fill="none" stroke="#42affa" stroke-width="3" marker-end="url(#af-signal)"><path d="M366 56H413"/><path d="M686 56H733"/></g>
<g font-size="20" text-anchor="middle"><text x="230" y="126" fill="#aab7c3">曝光与读出</text><text x="550" y="126" fill="#ffbf69">拟承担的计算环节</text><text x="870" y="126" fill="#aab7c3">执行器与调焦镜组</text></g>
<!-- Physical feedback travels outside the modules and beneath their captions. -->
<path d="M1001 56H1035Q1050 56 1050 71V170Q1050 185 1035 185H65Q50 185 50 170V71Q50 56 65 56H98" fill="none" stroke="#aab7c3" stroke-width="2.5" marker-end="url(#af-feedback)"/>
<text x="550" y="174" text-anchor="middle" font-size="22" fill="#aab7c3">镜头位置改变 → 成像状态改变</text>
<text x="550" y="228" text-anchor="middle" font-size="23" fill="#f5f7fa">整机对焦时间由传感、计算与调焦闭环共同决定</text>
</g></svg>