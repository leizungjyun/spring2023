<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1140 272" role="img"><style>text{font-family:Arial,sans-serif;fill:#203441}.small{font-size:17px;fill:#607582}.label{font-size:22px;font-weight:600}.blue{fill:#00649e}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#00649e" stroke-width="1.5"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#b76b29" stroke-width="1.5"/></marker></defs><path d="M570 12V262" stroke="#d5e2e9" stroke-width="2" stroke-dasharray="6 8"/>
